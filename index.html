<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>WhatsApp Reaction</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #252525 0, #111 45%, #080808 100%);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 430px;
}

.card {
  background: rgba(25,25,25,.94);
  border: 1px solid #333;
  border-radius: 24px;
  padding: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.logo {
  width: 65px;
  height: 65px;
  margin: 0 auto 15px;
  border-radius: 18px;
  background: #25D366;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 34px;
}

h1 {
  text-align: center;
  margin: 0;
  font-size: 25px;
}

.subtitle {
  text-align: center;
  color: #999;
  margin: 8px 0 25px;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #ccc;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 13px;
  border: 1px solid #3b3b3b;
  outline: none;
  background: #111;
  color: white;
  font-size: 14px;
}

input:focus {
  border-color: #25D366;
}

.reactions {
  display: flex;
  gap: 10px;
  margin-top: 10px;
  margin-bottom: 22px;
}

.reaction {
  flex: 1;
  padding: 13px 5px;
  border-radius: 13px;
  border: 1px solid #3b3b3b;
  background: #111;
  color: white;
  font-size: 25px;
  cursor: pointer;
  transition: .2s;
}

.reaction.active {
  background: #183b27;
  border-color: #25D366;
  transform: translateY(-2px);
}

button.send {
  width: 100%;
  border: none;
  padding: 15px;
  border-radius: 14px;
  background: #25D366;
  color: #061b0d;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button.send:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 13px;
  background: #111;
  border: 1px solid #333;
  font-size: 13px;
  line-height: 1.5;
  word-break: break-word;
}

.status.show {
  display: block;
}

.status.success {
  border-color: #25D366;
}

.status.error {
  border-color: #ff4d4d;
}

.loading {
  display: inline-block;
  width: 15px;
  height: 15px;
  border: 2px solid rgba(0,0,0,.3);
  border-top-color: #061b0d;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  vertical-align: middle;
  margin-right: 7px;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.footer {
  text-align: center;
  margin-top: 15px;
  color: #666;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">💚</div>

    <h1>WhatsApp Reaction</h1>

    <div class="subtitle">
      Kirim reaction ke channel WhatsApp
    </div>

    <label>URL WhatsApp</label>

    <input
      id="url"
      type="url"
      placeholder="https://whatsapp.com/channel/..."
      autocomplete="off"
    >

    <br><br>

    <label>Pilih Reaction</label>

    <div class="reactions">

      <button class="reaction" data-reaction="❤️">
        ❤️
      </button>

      <button class="reaction" data-reaction="👍">
        👍
      </button>

      <button class="reaction" data-reaction="🔥">
        🔥
      </button>

    </div>

    <button class="send" id="send">
      Kirim Reaction
    </button>

    <div id="status" class="status"></div>

  </div>

  <div class="footer">
    Reaction Web
  </div>

</div>

<script>
const reactionButtons =
  document.querySelectorAll(".reaction");

const sendButton =
  document.getElementById("send");

const urlInput =
  document.getElementById("url");

const statusBox =
  document.getElementById("status");

let selectedReactions = [];

reactionButtons.forEach(button => {

  button.addEventListener("click", () => {

    const reaction =
      button.dataset.reaction;

    if (selectedReactions.includes(reaction)) {

      selectedReactions =
        selectedReactions.filter(
          x => x !== reaction
        );

      button.classList.remove("active");

    } else {

      selectedReactions.push(reaction);

      button.classList.add("active");
    }

  });

});

function showStatus(message, type) {

  statusBox.className =
    "status show " + type;

  statusBox.textContent = message;
}

sendButton.addEventListener("click", async () => {

  const url = urlInput.value.trim();

  if (!url) {
    showStatus(
      "Masukkan URL WhatsApp terlebih dahulu.",
      "error"
    );
    return;
  }

  if (!url.includes("whatsapp.com")) {
    showStatus(
      "URL harus berupa link WhatsApp.",
      "error"
    );
    return;
  }

  if (selectedReactions.length === 0) {
    showStatus(
      "Pilih minimal satu reaction.",
      "error"
    );
    return;
  }

  sendButton.disabled = true;

  sendButton.innerHTML =
    '<span class="loading"></span>Memproses...';

  showStatus(
    "Mengambil challenge dan mengirim reaction...",
    ""
  );

  try {

    const response =
      await fetch("/api/send-react", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          url: url,
          reactions: selectedReactions
        })

      });

    const data =
      await response.json();

    console.log(data);

    if (response.ok && data.status) {

      showStatus(
        "✅ Reaction berhasil diproses!\n\n" +
        JSON.stringify(data.result, null, 2),
        "success"
      );

    } else {

      showStatus(
        "❌ Gagal:\n" +
        (data.message ||
        JSON.stringify(data.result || data)),
        "error"
      );

    }

  } catch (error) {

    showStatus(
      "❌ Terjadi error koneksi:\n" +
      error.message,
      "error"
    );

  } finally {

    sendButton.disabled = false;

    sendButton.textContent =
      "Kirim Reaction";

  }

});
</script>

</body>
</html>
